<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1200" viewBox="0 0 1400 1200" role="img" aria-label="按照片方向绘制的40针接线图，矩阵行接前排2、4、8、10，列接20、22、26、28；断电确认与主板J7同号1对1映射">
<style>text{font-family:'Noto Sans CJK SC','Microsoft YaHei',sans-serif;fill:#132231} .small{font-size:18px;fill:#475b6c}.body{font-size:21px}.label{font-size:20px;font-weight:600}.title{font-size:36px;font-weight:700}.mono{font-family:'DejaVu Sans Mono','Cascadia Code',monospace}.pin{font-size:19px;font-weight:700;text-anchor:middle}.white{fill:#fff}.dim{fill:#6b7b88} .note{font-size:19px;fill:#8c2e20}</style>
