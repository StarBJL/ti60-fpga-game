<text x="42" y="58" class="title">按你这张照片的方向接：8 根线全在前排偶数脚</text>
<text x="42" y="96" class="body">绿色转接板 2×20 排针 · 图按同号直通主板 J7 绘制，接线前先断电量通断</text>
<rect x="42" y="120" width="1316" height="55" rx="6" fill="#fff3e8" stroke="#bd7843"/>
<text x="60" y="155" class="note">确认前提：转接板 2 ↔ 主板 J7 2、4 ↔ J7 4……均为 1:1。未确认前，不按照片直接上电接线。</text>
<rect x="75" y="198" width="1250" height="205" rx="8" fill="#e9f1ed" stroke="#829b8d" stroke-width="2"/>
<text x="96" y="225" class="small">后排 / 远离镜头：奇数脚</text><text x="96" y="393" class="small">前排 / 靠近镜头：偶数脚</text>
