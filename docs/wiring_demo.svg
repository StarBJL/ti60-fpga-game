53" class="pin" style="fill:#9c3f78;font-size:18px">28</text><path d="M550 356V505" fill="none" stroke="#4f55a5" stroke-width="5"/><circle cx="550" cy="520" r="15" fill="white" stroke="#4f55a5" stroke-width="3"/><rect x="526" y="472" width="48" height="28" rx="4" fill="#f5f8fb"/><text x="550" y="492" class="pin" style="fill:#4f55a5;font-size:18px">C2</text><text x="550" y="553" class="pin" style="fill:#4f55a5;font-size:18px">26</text><path d="M670 356V505" fill="none" stroke="#815b30" stroke-width="5"/><circle cx="670" cy="520" r="15" fill="white" stroke="#815b30" stroke-width="3"/><rect x="646" y="472" width="48" height="28" rx="4" fill="#f5f8fb"/><text x="670" y="492" class="pin" style="fill:#815b30;font-size:18px">C1</text><text x="670" y="553" class="pin" style="fill:#815b30;font-size:18px">22</text><path d="M730 356V505" fill="none" stroke="#147d88" stroke-width="5"/><circle cx="730" cy="520" r="15" fill="white" stroke="#147d88" stroke-width="3"/><rect x="706" y="472" width="48" height="28" rx="4" fill="#f5f8fb"/><text x="730" y="492" class="pin" style="fill:#147d88;font-size:18px">C0</text><text x="730" y="553" class="pin" style="fill:#147d88;font-size:18px">20</text><path d="M1030 356V505" fill="none" stroke="#b63b3b" stroke-width="5"/><circle cx="1030" cy="520" r="15" fill="white" stroke="#b63b3b" stroke-width="3"/><rect x="1006" y="472" width="48" height="28" rx="4" fill="#f5f8fb"/><text x="1030" y="492" class="pin" style="fill:#b63b3b;font-size:18px">R3</text><text x="1030" y="553" class="pin" style="fill:#b63b3b;font-size:18px">10</text><path d="M1090 356V505" fill="none" stroke="#ba6200" stroke-width="5"/><circle cx="1090" cy="520" r="15" fill="white" stroke="#ba6200" stroke-width="3"/><rect x="1066" y="472" width="48" height="28" rx="4" fill="#f5f8fb"/><text x="1090" y="492" class="pin" style="fill:#ba6200;font-size:18px">R2</text><text x="1090" y="553" class="pin" style="fill:#ba6200;font-size:18px">8</text><path d="M1210 356V505" fill="none" stroke="#1b7a53" stroke-width="5"/><circle cx="1210" cy="520" r="15" fill="white" stroke="#1b7a53" stroke-width="3"/><rect x="1186" y="472" width="48" height="28" rx="4" fill="#f5f8fb"/><text x="1210" y="492" class="pin" style="fill:#1b7a53;font-size:18px">R1</text><text x="1210" y="553" class="pin" style="fill:#1b7a53;font-size:18px">4</text><path d="M1270 356V505" fill="none" stroke="#1967a3" stroke-width="5"/><circle cx="1270" cy="520" r="15" fill="white" stroke="#1967a3" stroke-width="3"/><rect x="1246" y="472" width="48" height="28" rx="4" fill="#f5f8fb"/><text x="1270" y="492" class="pin" style="fill:#1967a3;font-size:18px">R0</text><text x="1270" y="553" class="pin" style="fill:#1967a3;font-size:18px">2</text><path d="M230 654V902" stroke="#147d88" stroke-width="3"/><text x="230" y="641" class="pin" style="fill:#147d88">C0</text><path d="M340 654V902" stroke="#815b30" stroke-width="3"/><text x="340" y="641" class="pin" style="fill:#815b30">C1</text><path d="M450 654V902" stroke="#4f55a5" stroke-width="3"/><text x="450" y="641" class="pin" style="fill:#4f55a5">C2</text><path d="M560 654V902" stroke="#9c3f78" stroke-width="3"/><text x="560" y="641" class="pin" style="fill:#9c3f78">C3</text><path d="M150 690H615" stroke="#1967a3" stroke-width="3"/><text x="98" y="697" class="label" style="fill:#1967a3">R0</text><rect x="199" y="669" width="62" height="42" rx="5" fill="#fff" stroke="#8699a9"/><text x="230" y="697" class="pin">S1</text><rect x="309" y="669" width="62" height="42" rx="5" fill="#fff" stroke="#8699a9"/><text x="340" y="697" class="pin">S2</text><rect x="419" y="669" width="62" height="42" rx="5" fill="#fff" stroke="#8699a9"/><text x="450" y="697" class="pin">S3</text><rect x="529" y="669" width="62" height="42" rx="5" fill="#fff" stroke="#8699a9"/><text x="560" y="697" class="pin">S4</text><path d="M150 755H615" stroke="#1b7a53" stroke-width="3"/><text x="98" y="762" class="label" style="fill:#1b7a53">R1</text><rect x="199" y="734" width="62" height="42" rx="5" fill="#fff" stroke="#8699a9"/><text x="230" y="762" class="pin">S5</text><rect x="309" y="734" width="62" height="42" rx="5" fill="#fff" stroke="#8699a9"/><text x="340" y="762" class="pin">S6</text><rect x="419" y="734" width="62" height="42" rx="5" fill="#fff" stroke="#8699a9"/><text x="450" y="762" class="pin">S7</text><rect x="529" y="734" width="62" height="42" rx="5" fill="#fff" stroke="#8699a9"/><text x="560" y="762" class="pin">S8</text><path d="M150 820H615" stroke="#ba6200" stroke-width="3"/><text x="98" y="827" class="label" style="fill:#ba6200">R2</text><rect x="199" y="799" width="62" height="42" rx="5" fill="#fff" stroke="#8699a9"/><text x="230" y="827" class="pin">S9</text><rect x="309" y="799" width="62" height="42" rx="5" fill="#fff" stroke="#8699a9"/><text x="340" y="827" class="pin">S10</text><rect x="419" y="799" width="62" height="42" rx="5" fill="#fff" stroke="#8699a9"/><text x="450" y="827" class="pin">S11</text><rect x="529" y="799" width="62" height="42" rx="5" fill="#fff" stroke="#8699a9"/><text x="560" y="827" class="pin">S12</text><path d="M150 885H615" stroke="#b63b3b" stroke-width="3"/><text x="98" y="892" class="label" style="fill:#b63b3b">R3</text><rect x="199" y="864" width="62" height="42" rx="5" fill="#fff" stroke="#8699a9"/><text x="230" y="892" class="pin">S13</text><rect x="309" y="864" width="62" height="42" rx="5" fill="#fff" stroke="#8699a9"/><text x="340" y="892" class="pin">S14</text><rect x="419" y="864" width="62" height="42" rx="5" fill="#fff" stroke="#8699a9"/><text x="450" y="892" class="pin">S15</text><rect x="529" y="864" width="62" height="42" rx="5" fill="#fff" stroke="#8699a9"/><text x="560" y="892" class="pin">S16</text><text x="690" y="620" class="label">这里标的是“逻辑线名”，不是实物 8 针的顺序。</text>
<text x="690" y="655" class="body">先用万用表找出 R0—R3、C0—C3，再接这些针：</text><circle cx="700" cy="696" r="8" fill="#1967a3"/><text x="723" y="703" class="label" style="fill:#1967a3">R0  →  前排 2 脚</text><circle cx="700" cy="747" r="8" fill="#1b7a53"/><text x="723" y="754" class="label" style="fill:#1b7a53">R1  →  前排 4 脚</text><circle cx="700" cy="798" r="8" fill="#ba6200"/><text x="723" y="805" class="label" style="fill:#ba6200">R2  →  前排 8 脚</text><circle cx="700" cy="849" r="8" fill="#b63b3b"/><text x="723" y="856" class="label" style="fill:#b63b3b">R3  →  前排 10 脚</text><circle cx="1010" cy="696" r="8" fill="#147d88"/><text x="1033" y="703" class="label" style="fill:#147d88">C0  →  前排 20 脚</text><circle cx="1010" cy="747" r="8" fill="#815b30"/><text x="1033" y="754" class="label" style="fill:#815b30">C1  →  前排 22 脚</text><circle cx="1010" cy="798" r="8" fill="#4f55a5"/><text x="1033" y="805" class="label" style="fill:#4f55a5">C2  →  前排 26 脚</text><circle cx="1010" cy="849" r="8" fill="#9c3f78"/><text x="1033" y="856" class="label" style="fill:#9c3f78">C3  →  前排 28 脚</text><text x="690" y="918" class="small">行只驱动低/高阻；列上拉在 Bank 1B 的 1.8 V。</text>
<rect x="42" y="968" width="820" height="190" rx="6" fill="#fff" stroke="#8298ab"/>
<text x="62" y="1004" class="label">矩阵只接上述 8 根信号，不接 5 V / 3.3 V。</text>
<text x="62" y="1040" class="body">适用纯无源开关板；不另接 VCC 或 GND。</text>
<text x="62" y="1076" class="body">例：按 S1 接通 R0—C0；按 S2 接通 R0—C1。</text>
<text x="62" y="1112" class="small">线序要实测；不能假定键盘排针第 1—8 脚就是 R0…C3。</text>
<text x="62" y="1143" class="small">矩阵无二极管时有鬼键限制；使用配套 R5 bit 和固件。</text>
<rect x="884" y="968" width="474" height="190" rx="6" fill="#edf4fa" stroke="#8298ab"/>
<text x="904" y="1004" class="label">另一个外设：CH9350L（可稍后接）</text>
<text x="904" y="1040" class="body">模块 TX → 前排 32 / FPGA RX</text>
<text x="904" y="1076" class="body">模块 RX ← 前排 34 / FPGA TX</text>
<text x="904" y="1112" class="small">这两路是 3.3 V UART，与矩阵线分开。</text>
<text x="904" y="1143" class="small">模块 5 V 电源和 GND 另按实物确认连接。</text>
</svg>