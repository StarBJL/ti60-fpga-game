name: technical-checks
on:
  push:
    branches: [main, 'refactor/**']
  pull_request:

jobs:
  static-and-rtl:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Validate project paths, docs and artifact checksums
        run: python3 tools/check_repo.py --hash
      - name: Install Icarus Verilog
        run: sudo apt-get update && sudo apt-get install -y iverilog
      - name: Run AXI read arbitration RTL test
        run: bash verification/axi_read_arb/run.sh
